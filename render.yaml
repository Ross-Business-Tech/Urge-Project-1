# Render Blueprint: one Node web service that builds the app and runs server.mjs.
# In Render: New + > Blueprint > pick this repository, or create a Web Service with the same settings.
services:
  - type: web
    name: memo-drafter
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_PASSWORD
        sync: false # the one shared password everyone uses to sign in (leave empty for an open site)
      - key: OPENROUTER_API_KEY
        sync: false # Render asks for the value; it is never stored in the repository
      # The key can be from OpenRouter (sk-or-...), OpenAI (sk-...) or the U-M GPT Toolkit
      # (toolkit.umgpt.umich.edu). Optional extras, added under Environment if needed:
      #   AI_ORGANIZATION  U-M shortcode (6 digits), if the U-M key requires it
      #   AI_MODEL         a specific model (otherwise chosen from what the service offers)
      #   AI_BASE_URL      a different OpenAI-compatible address
